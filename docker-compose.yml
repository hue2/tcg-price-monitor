# docker compose up -d --build
# Needs ./data/config.yaml (copy config.example.yaml and set `database: tcgwatch.db`).
x-tcgwatch: &tcgwatch
  build: .
  image: tcgwatch:local
  volumes:
    - ./data:/data          # config.yaml + tcgwatch.db; runtime only, never in the image
  environment:
    TZ: UTC
    # Optional: Discord webhook from the host environment or a git-ignored .env file.
    TCGWATCH_DISCORD_WEBHOOK: ${TCGWATCH_DISCORD_WEBHOOK:-}
  restart: unless-stopped

services:
  web:
    <<: *tcgwatch
    # 0.0.0.0 is the in-container bind; the host port below is loopback-only, so the no-token
    # allow is explicit. To publish beyond loopback, set TCGWATCH_WEB_TOKEN and change the port mapping.
    command: ["web", "--host", "0.0.0.0", "--port", "8765", "--insecure-no-auth"]
    environment:            # a service-level `environment` replaces the shared one, so repeat it
      TZ: UTC
      TCGWATCH_DISCORD_WEBHOOK: ${TCGWATCH_DISCORD_WEBHOOK:-}
      TCGWATCH_WEB_TOKEN: ${TCGWATCH_WEB_TOKEN:-}   # set = every request needs it (Bearer or POST /login)
    ports:
      - "127.0.0.1:8765:8765"   # loopback only
  scheduler:
    <<: *tcgwatch
    command: ["schedule"]       # daily at schedule.at (UTC): snapshot, catch-up, check
    healthcheck:                # healthy = an ok job_runs row (skips count) within 24h + late_window + 1h (28h)
      test: ["CMD", "tcgwatch", "health"]       # default max-age derived from schedule.late_window
      interval: 15m
      timeout: 10s
      start_period: 28h         # first daily run may not have happened yet
      retries: 1
