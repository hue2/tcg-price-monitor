# Build the Docker image once, smoke that exact image, and publish that same image to GHCR (ghcr.io/hue2/tcg-price-monitor).
# `build` is read-only (contents: read) and runs on every event; `publish` alone holds packages:write and runs only on
# main (push event or a workflow_dispatch run on main). The image is passed between them as a docker-save artifact and
# its image id is re-checked before the push, so what is smoked is byte-for-byte what is published.
# The only credential is the built-in GITHUB_TOKEN; no other secrets are used.
name: docker-publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/hue2/tcg-price-monitor   # must be lowercase (GHCR rejects uppercase)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Read the package version
        id: ver
        run: python3 -c "import tomllib,pathlib;print('version=' + tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      # 1. The one and only build: into the local docker store (no push).
      - name: Build (load, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Smoke gate on that loaded image (no rebuild). Fails closed: a non-zero exit, a SKIP (no docker)
      #    or a missing marker fails the job.
      - name: Smoke check (scripts/docker-smoke.sh)
        env:
          TCGWATCH_SMOKE_IMAGE: ${{ env.IMAGE_NAME }}:ci-smoke
        run: |
          set -euo pipefail
          out="$(mktemp)"
          scripts/docker-smoke.sh 2>&1 | tee "$out"
          grep -qx 'docker-smoke OK' "$out"

      # 3. Hand the tested image to the publish job unchanged.
      - name: Export the tested image
        run: |
          set -euo pipefail
          mkdir image-out
          docker image inspect --format '{{.Id}}' "${IMAGE_NAME}:ci-smoke" > image-out/image-id.txt
          docker save "${IMAGE_NAME}:ci-smoke" -o image-out/image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: tested-image
          path: image-out
          retention-days: 1

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write   # the only job with this scope; used by the GITHUB_TOKEN login below
    steps:
      - uses: actions/checkout@v7

      - name: Read the package version
        id: ver
        run: python3 -c "import tomllib,pathlib;print('version=' + tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: tested-image
          path: image-out

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ver.outputs.version }}
            type=sha,prefix=sha-,format=short

      - name: Load the tested image and verify its identity
        run: |
          set -euo pipefail
          docker load -i image-out/image.tar
          want="$(cat image-out/image-id.txt)"
          got="$(docker image inspect --format '{{.Id}}' "${IMAGE_NAME}:ci-smoke")"
          test -n "$want" && test "$got" = "$want"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker push of tags on the loaded image: no rebuild, so the pushed image is the smoked one.
      - name: Push the tested image to GHCR
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "${IMAGE_NAME}:ci-smoke" "$tag"
            docker push "$tag"
          done <<< "$TAGS"
