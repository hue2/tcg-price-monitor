[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcg-price-watch"
version = "0.12.0"
description = "Flag TCG card singles whose price moved past a threshold over a time window."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",   # comment-preserving config writes from the web app
    "py7zr>=0.22",         # TCGCSV history archives (backfill)
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[project.scripts]
tcgwatch = "tcgwatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tcgwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Coverage gate: 95 since REL-0.4 (was 90 from COV-1). Measured total on main is 97.6%, so 95 is the measured value rounded down to the nearest 5. Raise N as coverage grows.
addopts = ["--cov=tcgwatch", "--cov-fail-under=95", "-m", "not slow"]
# `slow`: seeded large-DB benchmarks (tests/test_perf_benchmarks.py). Run with `pytest -m slow --no-cov -s`.
markers = ["slow: large seeded-DB performance benchmark; excluded from the default run"]
filterwarnings = [
    # Starlette's TestClient prefers httpx2; httpx still works. Remove once dev deps move to httpx2.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # TEST-10 (PLAN-4): a leaked resource (unclosed HTTP error body, DB connection, pipe fd) fails the run.
    "error::ResourceWarning",
    # GC-time ResourceWarnings are re-raised by pytest as PytestUnraisableExceptionWarning; without this line they only warn.
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# ruff defaults (pycodestyle E4/E7/E9 + pyflakes F); no mass reformat.
select = ["E4", "E7", "E9", "F"]
